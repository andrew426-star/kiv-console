name: Agent launch jobs

# Scheduled reports from the Slack agents for the January 2027 launch.
# Each schedule maps to one job in src/lib/agents/jobs.ts (the source of
# truth for prompts and times — src/lib/agents/__tests__/jobs.test.ts fails
# if this file drifts from it). The job runs the agent and posts to the team
# channel; scheduled runs can read and draft but never send or log.
#
# GitHub cron is UTC. Times below are US Central daylight time; after the
# November clock change they land an hour earlier.
on:
  schedule:
    - cron: "0 14 * * 1-5" # pipeline-standup, weekdays 9:00am
    - cron: "0 13 * * 1" # atlas-segment-intel, Mon 8:00am
    - cron: "30 13 * * 1" # pulse-content-plan, Mon 8:30am
    - cron: "0 17 * * 3" # chronicle-midweek-pace, Wed 12:00pm
    - cron: "0 13 * * 4" # atlas-publicity-radar, Thu 8:00am
    - cron: "0 17 * * 4" # pulse-build-in-public, Thu 12:00pm
    - cron: "0 23 * * 0" # chronicle-weekly-review, Sun 6:00pm
  workflow_dispatch:
    inputs:
      job:
        description: Job id from src/lib/agents/jobs.ts
        required: true
        type: choice
        options:
          - pipeline-standup
          - atlas-segment-intel
          - atlas-publicity-radar
          - pulse-content-plan
          - pulse-build-in-public
          - chronicle-midweek-pace
          - chronicle-weekly-review

jobs:
  run-agent-job:
    runs-on: ubuntu-latest
    steps:
      - name: Pick job
        id: pick
        run: |
          if [ -n "${{ inputs.job }}" ]; then
            job="${{ inputs.job }}"
          else
            case "${{ github.event.schedule }}" in
              "0 14 * * 1-5") job=pipeline-standup ;;
              "0 13 * * 1") job=atlas-segment-intel ;;
              "30 13 * * 1") job=pulse-content-plan ;;
              "0 17 * * 3") job=chronicle-midweek-pace ;;
              "0 13 * * 4") job=atlas-publicity-radar ;;
              "0 17 * * 4") job=pulse-build-in-public ;;
              "0 23 * * 0") job=chronicle-weekly-review ;;
              *) echo "No job for schedule '${{ github.event.schedule }}'"; exit 1 ;;
            esac
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
      - name: Run ${{ steps.pick.outputs.job }}
        run: |
          # Render may need to wake the service first; allow a long timeout.
          curl --fail-with-body --max-time 300 -X POST \
            -H "Authorization: Bearer ${{ secrets.ALE_BATCH_API_KEY }}" \
            https://kiv-console.onrender.com/api/agents/jobs/${{ steps.pick.outputs.job }}
